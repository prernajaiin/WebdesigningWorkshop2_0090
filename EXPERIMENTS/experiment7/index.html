<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Student Information</title>

  <style>
    body{
      font-family: Arial, sans-serif;
      background-color: #f2f2f2;
    }

    .container{
      width: 500px;
      margin: 30px auto;
      border: 3px solid black;
      padding: 20px;
      text-align: center;
      background-color: #f2f2f2;
    }

    h1{
      font-size: 55px;
      font-weight: bold;
      margin-bottom: 30px;
    }

    .card{
      width: 350px;
      margin: 25px auto;
      padding: 30px;
      background: white;
      border-radius: 20px;
      box-shadow: 0px 0px 10px lightgray;
    }

    .card h2{
      font-size: 30px;
      margin-bottom: 20px;
    }

    .card p{
      font-size: 22px;
      margin: 12px 0;
    }

    .outcome{
      width: 500px;
      margin: 20px auto;
      font-size: 28px;
    }

    .outcome h2{
      margin-bottom: 10px;
    }

    hr{
      margin-top: 30px;
      border: 2px solid gray;
    }
  </style>
</head>

<body>

  <div class="container">
    <h1>Student Information</h1>

    <div class="card">
      <h2>Rahul Sharma</h2>
      <p>Course: Computer Science</p>
      <p>Marks: 85</p>
    </div>

    <div class="card">
      <h2>Anita Verma</h2>
      <p>Course: Information Technology</p>
      <p>Marks: 92</p>
    </div>

    <div class="card">
      <h2>Rohan Gupta</h2>
      <p>Course: Electronics</p>
      <p>Marks: 78</p>
    </div>
  </div>

  <script>
    console.log("Student Information Page Loaded");
  </script>

</body>
</html>
