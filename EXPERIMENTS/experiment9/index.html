<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registration Form</title>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family: Arial, sans-serif;
    }

    body{
      background:#f2f2f2;
      padding:10px;
    }

    /* OUTER BORDER */
    .outer-box{
      width:345px;
      border:2px solid gray;
      padding:18px;
      margin:auto;
      background:#f2f2f2;
    }

    /* INNER FORM BOX */
    .form-box{
      width:300px;
      margin:auto;
      background:white;
      border-radius:8px;
      padding:35px 22px;
      box-shadow:0 0 8px rgba(0,0,0,0.2);
      text-align:center;
    }

    h2{
      margin-bottom:35px;
      font-size:18px;
      font-weight:bold;
    }

    input{
      width:100%;
      height:27px;
      margin-bottom:22px;
      border:1px solid #999;
      padding-left:8px;
      font-size:12px;
    }

    button{
      background:green;
      color:white;
      border:none;
      padding:8px 15px;
      font-size:11px;
      font-weight:bold;
      cursor:pointer;
      margin-top:5px;
    }

    #success{
      color:green;
      font-weight:bold;
      font-size:14px;
      margin-top:18px;
      display:none;
    }

    .users-box{
      background:#eef7ee;
      padding:18px;
      margin-top:18px;
      text-align:left;
      display:none;
    }

    .users-box h3{
      text-align:center;
      margin-bottom:15px;
      font-size:16px;
    }

    .users-box ul{
      padding-left:20px;
      font-size:14px;
    }

  </style>
</head>

<body>

  <div class="outer-box">

    <div class="form-box">

      <h2>Registration Form</h2>

      <input type="text" id="name" placeholder="Enter Name">

      <input type="email" id="email" placeholder="Enter Email">

      <input type="password" id="password" placeholder="Enter Password">

      <button onclick="registerUser()">Register</button>

      <div id="success">Registration Successful!</div>

      <div class="users-box" id="usersBox">
        <h3>Registered Users</h3>

        <ul id="userList"></ul>
      </div>

    </div>

  </div>

  <script>

    function registerUser(){

      let name = document.getElementById("name").value;
      let email = document.getElementById("email").value;

      if(name==="" || email===""){
        alert("Please fill all fields");
        return;
      }

      document.getElementById("success").style.display="block";
      document.getElementById("usersBox").style.display="block";

      let li=document.createElement("li");

      li.innerHTML=name + " - " + email;

      document.getElementById("userList").appendChild(li);

      document.getElementById("name").value="";
      document.getElementById("email").value="";
      document.getElementById("password").value="";
    }

  </script>

</body>
</html>
